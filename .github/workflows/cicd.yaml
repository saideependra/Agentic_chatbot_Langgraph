
name: Deploy LangGraph Chatbot to AWS EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  SSM_PARAMETER_NAME: ${{ vars.SSM_PARAMETER_NAME }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${GITHUB_SHA} .

      # 5. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${GITHUB_SHA} \
            ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}

      # 6. Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}

      # 7. Deploy to EC2 using Systems Manager
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<EOF
          set -e

          AWS_REGION="${AWS_REGION}"
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          ECR_REPOSITORY="${ECR_REPOSITORY}"
          IMAGE_TAG="${{ github.sha }}"
          SSM_PARAMETER_NAME="${SSM_PARAMETER_NAME}"

          # Authenticate EC2 with ECR
          aws ecr get-login-password --region "\$AWS_REGION" \
            | docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          # Pull latest application image
          docker pull "\$ECR_REGISTRY/\$ECR_REPOSITORY:\$IMAGE_TAG"

          # Retrieve Groq API key securely
          GROQ_API_KEY=\$(aws ssm get-parameter \
            --name "\$SSM_PARAMETER_NAME" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text \
            --region "\$AWS_REGION")

          # Create persistent storage directories
          mkdir -p /opt/agentic-chatbot/faiss_db
          mkdir -p /opt/agentic-chatbot/faiss_indexes
          mkdir -p /opt/agentic-chatbot/extracted_docs
          mkdir -p /opt/agentic-chatbot/data
          touch /opt/agentic-chatbot/data/chatbot.db

          # Stop old application
          docker stop agentic-chatbot || true
          docker rm agentic-chatbot || true

          # Start new application
          docker run -d \
            --name agentic-chatbot \
            --restart unless-stopped \
            -p 8501:8501 \
            -e GROQ_API_KEY="\$GROQ_API_KEY" \
            -v /opt/agentic-chatbot/faiss_db:/app/faiss_db \
            -v /opt/agentic-chatbot/faiss_indexes:/app/faiss_indexes \
            -v /opt/agentic-chatbot/extracted_docs:/app/extracted_docs \
            -v /opt/agentic-chatbot/data/chatbot.db:/app/chatbot.db \
            "\$ECR_REGISTRY/\$ECR_REPOSITORY:\$IMAGE_TAG" \
            streamlit run app.py \
            --server.address 0.0.0.0 \
            --server.port 8501 \
            --server.headless true

          # Remove dangling images
          docker image prune -f
          EOF
          )

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          # Wait for deployment result
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID"
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
